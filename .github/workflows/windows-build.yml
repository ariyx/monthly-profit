name: Build Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and publish installer
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish downloadable prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_id }}"
          gh release create $tag out/MonthlyProfit-Windows-x64.zip --target "${{ github.sha }}" --title "Windows build ${{ github.run_number }}" --prerelease --notes "Build generated by GitHub Actions."
